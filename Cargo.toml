[workspace]
members = [
    "raphael-sim",
    "raphael-solver",
    "raphael-data",
    "raphael-data-updater",
    "raphael-cli",
    "raphael-translations",
]
resolver = "2"

[workspace.lints]
clippy.assigning_clones = "warn"
clippy.single_char_pattern = "warn"
clippy.return_self_not_must_use = "warn"
clippy.format_push_string = "warn"
clippy.ref_option = "warn"
clippy.default_trait_access = "warn"
clippy.explicit_iter_loop = "warn"
clippy.unnecessary_semicolon = "warn"
clippy.redundant_closure_for_method_calls = "warn"
clippy.use_self = "warn"

[workspace.dependencies]
raphael-sim = { path = "raphael-sim" }
raphael-solver = { path = "raphael-solver" }
raphael-data = { path = "raphael-data" }
raphael-translations = { path = "raphael-translations" }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
toml_edit = "0.23"
log = { version = "0.4", features = ["std"] }
web-time = "1.1.0"

[package]
name = "raphael-xiv"
version = "0.28.6"
edition = "2024"
default-run = "raphael-xiv"

[lints]
workspace = true

[dependencies]
raphael-sim = { workspace = true, features = ["serde"] }
raphael-solver = { workspace = true, features = ["serde"] }
raphael-data = { workspace = true, features = ["serde"] }
raphael-translations = { workspace = true }

egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["http", "webp"] }
eframe = { version = "0.35.0", features = ["persistence"] }

rayon = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
ron = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"
semver = "1.0"
self-replace = "1.5.0"
tempfile = "3.24.0"
ehttp = { version = "0.5.0", features = ["json"] }
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "web_screen_reader",
    "x11",
    "persistence",
    "wgpu",
] }
wgpu = "27"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Make rayon bridge OPTIONAL so it doesn't compile unless the feature is enabled
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }
wasm-bindgen-futures = "0.4.64"
console_error_panic_hook = "0.1.7"
web-sys = "=0.3.91"
eframe = { version = "0.35.0", features = ["persistence"] }
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"

[dev-dependencies]
expect-test = "1.5.1"
strum = "0.27"

[profile.release]
opt-level = 3
lto = "fat"
overflow-checks = false
codegen-units = 1
panic = "abort"

[profile.release.package.egui]
opt-level = "s"

[profile.release.package.eframe]
opt-level = "s"

[profile.release-with-debug]
inherits = "release"
debug = true
debug-assertions = true

[profile.test]
opt-level = 3
lto = "thin"
overflow-checks = true

[features]
dev-panel = []
default = []
# Tie the rayon bridge to this feature so it only builds when you opt-in
wasm_threads = ["dep:wasm-bindgen-rayon"]
