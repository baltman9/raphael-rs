name: Sync from upstream (main)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare sync log
        run: |
          rm -f sync.log
          touch sync.log

      - name: Add upstream & fetch
        run: |
          set -o pipefail
          {
            git remote add upstream https://github.com/KonaeAkira/raphael-rs.git || true
            git fetch upstream main --tags
          } 2>&1 | tee -a sync.log

      - name: Configure committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main -> main
        id: merge
        run: |
          set -o pipefail
          {
            git checkout main
            BEFORE="$(git rev-parse HEAD)"
            git merge --ff-only upstream/main || git merge --no-edit upstream/main
            AFTER="$(git rev-parse HEAD)"
            echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee -a sync.log

      - name: Keep our workflows (ignore upstream workflow changes)
        if: ${{ success() }}
        run: |
          set -o pipefail
          {
            if git diff --name-only | grep -q '^\.github/workflows/'; then
              git checkout --ours .github/workflows || true
              git add .github/workflows || true
              git commit -m "Keep fork workflow files" || true
            fi
          } 2>&1 | tee -a sync.log

      - name: Push to origin (only if changed)
        if: ${{ success() && steps.merge.outputs.before != steps.merge.outputs.after }}
        env:
          PUSH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -o pipefail
          git push "https://baltman9:${PUSH_TOKEN}@github.com/${{ github.repository }}" main 2>&1 | tee -a sync.log

      - name: Notify deploy (only if changed)
        if: ${{ success() && steps.merge.outputs.before != steps.merge.outputs.after }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: deploy-from-sync

      - name: "Discord: sync failed"
        if: ${{ failure() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set +e

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ ! -f sync.log ]; then
            echo "sync.log was not found" > sync.log
          fi

          conflicts="$(grep '^CONFLICT' sync.log | sed -E 's/^CONFLICT \([^)]*\): Merge conflict in /• /' || true)"

          if [ -n "$conflicts" ]; then
            msg="$(printf '❌ **Upstream sync failed**\n\nMerge conflict detected.\n\nFiles:\n%s\n\nRun:\n%s' "$conflicts" "$run_url")"
          else
            last_error="$(tail -n 20 sync.log)"
            msg="$(printf '❌ **Upstream sync failed**\n\nNo merge-conflict file list was detected. Last sync log lines:\n\n```text\n%s\n```\n\nRun:\n%s' "$last_error" "$run_url")"
          fi

          payload="$(jq -n --arg content "$msg" '{content: $content}')"

          curl -sS \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK"