name: Sync from upstream (main)

on:
  schedule: [{ cron: "0 2 * * *" }]   # still fine, even though cron is triggered via your pinger
  workflow_dispatch:

# Make sure the token can push and dispatch
permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/KonaeAkira/raphael-rs.git || true
          git fetch upstream main --tags

      - name: Configure committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main -> main
        id: merge
        run: |
          set -e
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          git merge --ff-only upstream/main || git merge --no-edit upstream/main
          AFTER=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER"  >> "$GITHUB_OUTPUT"

      - name: Push to origin (only if changed)
        if: steps.merge.outputs.before != steps.merge.outputs.after
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} main

      - name: Notify deploy (only if changed)
        if: steps.merge.outputs.before != steps.merge.outputs.after
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: deploy-from-sync
