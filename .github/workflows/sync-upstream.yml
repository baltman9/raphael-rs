name: Sync from upstream (main)

on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:

permissions:
  contents: write   # applies only to GITHUB_TOKEN – OK to keep

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Add upstream & fetch
        run: |
          git remote add upstream https://github.com/KonaeAkira/raphael-rs.git || true
          git fetch upstream main --tags

      - name: Configure committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main -> main
        id: merge
        run: |
          set -e
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          git merge --ff-only upstream/main || git merge --no-edit upstream/main
          AFTER=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER"  >> "$GITHUB_OUTPUT"

      # OPTIONAL but helpful: ignore upstream workflow changes so future pushes don't get blocked
      - name: Keep our workflows (ignore upstream workflow changes)
        run: |
          set -e
          if git diff --name-only | grep -q '^\.github/workflows/'; then
            git checkout --ours .github/workflows || true
            git add .github/workflows || true
            git commit -m "Keep fork workflow files" || true
          fi

      - name: Push to origin (only if changed)
        if: steps.merge.outputs.before != steps.merge.outputs.after
        env:
          PUSH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          git push https://baltman9:${PUSH_TOKEN}@github.com/${{ github.repository }} main

      # If you use repository_dispatch in deploy, keep this:
      - name: Notify deploy (only if changed)
        if: steps.merge.outputs.before != steps.merge.outputs.after
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: deploy-from-sync
