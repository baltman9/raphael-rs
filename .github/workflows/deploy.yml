name: Build & Deploy (main -> crafting.bryansmedia.com)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-from-sync]
  workflow_run:
    workflows: ["Sync from upstream (main)"]
    types: [completed]

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://crafting.bryansmedia.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use nightly toolchain with wasm target
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Configure Cargo for wasm threads (target-scoped flags)
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.wasm32-unknown-unknown]
          rustflags = [
            "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
            "-C", "link-arg=--shared-memory",
            "-C", "link-arg=--import-memory",
            "-C", "link-arg=--max-memory=4294967296",
          ]
          EOF
          echo "----- .cargo/config.toml -----"
          cat .cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install trunk & wasm-bindgen
        run: |
          cargo install --locked trunk
          cargo install -f wasm-bindgen-cli --version 0.2.106
          wasm-bindgen -V

      # Build std for wasm with panic-abort + atomics/bulk/shared
      - name: Build wasm (threaded std)
        env:
          RUSTFLAGS: >-
            -Z unstable-options
            -C panic=immediate-abort
            -C target-feature=+atomics,+bulk-memory,+mutable-globals
            -C link-arg=--shared-memory
            -C link-arg=--import-memory
            -C link-arg=--max-memory=4294967296
        run: |
          set -euo pipefail
          cargo +nightly build \
            -Z build-std=std,panic_abort \
            --target wasm32-unknown-unknown \
            --release

      - name: Locate wasm artifact
        id: wasm
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing wasm artifacts:"
          ls -lah target/wasm32-unknown-unknown/release || true
          WASM_PATH=$(ls target/wasm32-unknown-unknown/release/*.wasm | head -n1)
          if [ -z "${WASM_PATH:-}" ]; then
            echo "No .wasm produced under target/wasm32-unknown-unknown/release"
            exit 1
          fi
          echo "Found wasm: $WASM_PATH"
          echo "path=$WASM_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate wasm-bindgen (threaded)
        run: |
          mkdir -p dist_wbg
          wasm-bindgen \
            --target web \
            --no-typescript \
            --out-dir dist_wbg \
            --out-name raphael-xiv \
            "${{ steps.wasm.outputs.path }}"

      - name: Build HTML/assets with Trunk (no wasm overrides yet)
        run: |
          trunk build index.html --release --dist dist_trunk

      - name: Assemble final dist (threaded wasm + patched index.html)
        shell: bash
        run: |
          set -euo pipefail
          rsync -a dist_trunk/ dist/
          cp -f dist_wbg/raphael-xiv.js dist/
          cp -f dist_wbg/raphael-xiv_bg.wasm dist/
          sed -i -E 's#raphael-xiv-[A-Za-z0-9]+\.js#raphael-xiv.js#g' dist/index.html || true
          sed -i -E 's#raphael-xiv-[A-Za-z0-9]+_bg\.wasm#raphael-xiv_bg.wasm#g' dist/index.html || true
          cat > dist/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp

          /index.html
            Cache-Control: no-cache

          /*.js
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin

          /*.wasm
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin
          EOF

      - name: Debug - verify token from secrets
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "Verifying token..."
          curl -fsSL -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | jq '{success, result: {status, id}}'

      - name: Debug - list Pages projects for this account
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Account: ${CF_ACCOUNT_ID}"
          curl -fsSL -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" \
            | jq '{success, names: [.result[].name]}'

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:   ${{ secrets.CF_API_TOKEN }}
          accountId:  ${{ secrets.CF_ACCOUNT_ID }}
          projectName: "ff14crafting"
          directory:  dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect version change in Cargo.toml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CARGO_FILE="Cargo.toml"
          git fetch --no-tags --depth=2 origin "${GITHUB_REF_NAME:-main}" || true
          prev="${{ github.event.before || '' }}"
          curr="${{ github.sha }}"
          if [ -z "$prev" ]; then
            prev="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          changed="false"
          if [ -n "$prev" ] && git diff --name-only "$prev" "$curr" | grep -x "$CARGO_FILE" >/dev/null 2>&1; then
            changed="true"
          fi
          version="$(
            awk '
              /^\[package\]$/ { p=1; next }
              /^\[/          { p=0 }
              p && /^version[[:space:]]*=/ {
                gsub(/"/,"",$3); print $3; exit
              }
            ' "$CARGO_FILE"
          )"
          echo "changed=$changed"  >> "$GITHUB_OUTPUT"
          echo "version=$version"  >> "$GITHUB_OUTPUT"

      - name: "Discord: deployed new version (embed)"
        if: ${{ steps.ver.outputs.changed == 'true' && success() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          site="https://crafting.bryansmedia.com/"
          title="Deployed v${{ steps.ver.outputs.version }}"
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          payload=$(jq -n \
            --arg t "$title" \
            --arg site "$site" \
            --arg repo "$repo" \
            --arg sha "$sha" \
            '{
              content: "",
              embeds: [{
                title: $t,
                url: $site,
                color: 5763719,
                fields: [
                  { "name": "Site",   "value": "<\($site)>", "inline": false },
                  { "name": "Repo",   "value": $repo,        "inline": true  },
                  { "name": "Commit", "value": "`\($sha)`",  "inline": true  }
                ]
              }]
            }')
          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"

      - name: "Discord: deploy failed"
        if: ${{ failure() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="❌ Deploy failed for **${{ github.repository }}** on **${{ github.ref_name }}**  \nRun: ${run_url}"
          curl -sS -H "Content-Type: application/json" -d "{\"content\":\"${msg}\"}" "$DISCORD_WEBHOOK"
