name: Build & Deploy (main -> crafting.bryansmedia.com)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-from-sync]
  workflow_run:
    workflows: ["Sync from upstream (main)"]
    types: [completed]

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # --- Checkout ---
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD and HEAD~1 for version-change detection

      # --- Rust toolchain for wasm ---
      - name: Use nightly toolchain with wasm target
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src

      # --- Scope wasm flags to ONLY the wasm target ---
      - name: Configure Cargo for wasm threads
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.wasm32-unknown-unknown]
          rustflags = [
            "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
            "-C", "link-arg=--shared-memory",
            "-C", "link-arg=--max-memory=4294967296",
          ]
          EOF
          echo "----- .cargo/config.toml -----"
          cat .cargo/config.toml

      # --- Cache cargo to speed up builds ---
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # --- Install tooling ---
      - name: Install tools (trunk, jq)
        run: |
          cargo install --locked trunk
          sudo apt-get update -y
          sudo apt-get install -y jq

      # --- Build front-end (outputs to dist/) ---
      - name: Build web (release)
        run: |
          trunk build index.html --release --dist dist

      # --- Build the crate for wasm (applies target-scoped flags above) ---
      - name: Build wasm (release)
        run: cargo build --release --target wasm32-unknown-unknown

      # --- Generate threaded JS glue and worker helpers ---
      - name: Generate wasm-bindgen (threaded)
        run: |
          cargo install -f wasm-bindgen-cli --version 0.2.92
          mkdir -p dist
          # If your Cargo package name is different, update the .wasm filename below:
          wasm-bindgen \
            --target web \
            --no-typescript \
            --out-dir dist \
            --out-name raphael-xiv \
            --enable-threading \
            target/wasm32-unknown-unknown/release/raphael_xiv.wasm

      # --- Add COOP/COEP/CORP headers (and caching) ---
      - name: Write _headers for Cloudflare Pages
        run: |
          cat > dist/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp

          /index.html
            Cache-Control: no-cache

          /*.js
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin

          /*.wasm
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin
          EOF
          echo "----- dist/_headers -----"
          cat dist/_headers

      # --- Optional debug: verify CF token and list Pages projects ---
      - name: Debug - verify token from secrets
        shell: bash
        env:
          CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}"
        run: |
          set -euo pipefail
          echo "Verifying token..."
          curl -fsSL -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | jq '{success, result: {status, id}}'

      - name: Debug - list Pages projects for this account
        shell: bash
        env:
          CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}"
          CF_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}"
        run: |
          set -euo pipefail
          echo "Account: ${CF_ACCOUNT_ID}"
          curl -fsSL -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" \
            | jq '{success, names: [.result[].name]}'

      # --- Publish to Cloudflare Pages ---
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:   ${{ secrets.CF_API_TOKEN }}
          accountId:  ${{ secrets.CF_ACCOUNT_ID }}
          projectName: "ff14crafting"
          directory:  dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # --- Detect version change in Cargo.toml (optional embed note) ---
      - name: Detect version change in Cargo.toml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CARGO_FILE="Cargo.toml"
          git fetch --no-tags --depth=2 origin "${GITHUB_REF_NAME:-main}" || true
          prev="${{ github.event.before || '' }}"
          curr="${{ github.sha }}"
          if [ -z "$prev" ]; then
            prev="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          changed="false"
          if [ -n "$prev" ] && git diff --name-only "$prev" "$curr" | grep -x "$CARGO_FILE" >/dev/null 2>&1; then
            changed="true"
          fi
          version="$(
            awk '
              /^\[package\]$/ { p=1; next }
              /^\[/          { p=0 }
              p && /^version[[:space:]]*=/ {
                gsub(/"/,"",$3); print $3; exit
              }
            ' "$CARGO_FILE"
          )"
          echo "changed=$changed"  >> "$GITHUB_OUTPUT"
          echo "version=$version"  >> "$GITHUB_OUTPUT"

      # --- Discord success embed only if version changed ---
      - name: "Discord: deployed new version (embed)"
        if: ${{ steps.ver.outputs.changed == 'true' && success() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          site="https://crafting.bryansmedia.com/"
          title="Deployed v${{ steps.ver.outputs.version }}"
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          payload=$(jq -n \
            --arg t "$title" \
            --arg site "$site" \
            --arg repo "$repo" \
            --arg sha "$sha" \
            '{
              content: "",
              embeds: [{
                title: $t,
                url: $site,
                color: 5763719,
                fields: [
                  { "name": "Site",   "value": "<\($site)>", "inline": false },
                  { "name": "Repo",   "value": $repo,        "inline": true  },
                  { "name": "Commit", "value": "`\($sha)`",  "inline": true  }
                ]
              }]
            }')
          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"

      # --- Discord failure notification (always if any step failed) ---
      - name: "Discord: deploy failed"
        if: ${{ failure() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="❌ Deploy failed for **${{ github.repository }}** on **${{ github.ref_name }}**  \nRun: ${run_url}"
          curl -sS -H "Content-Type: application/json" -d "{\"content\":\"${msg}\"}" "$DISCORD_WEBHOOK"
