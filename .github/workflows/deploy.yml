name: Build & Deploy (main -> crafting.bryansmedia.com)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      wasm_threads:
        description: "Build threaded wasm (1) or non-threaded (0)"
        type: choice
        required: false
        options: ["0","1"]
        default: "0"
  repository_dispatch:
    types: [deploy-from-sync]
  workflow_run:
    workflows: ["Sync from upstream (main)"]
    types: [completed]

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://crafting.bryansmedia.com"
      WASM_THREADS: ${{ github.event.inputs.wasm_threads || vars.WASM_THREADS || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use nightly toolchain with wasm target
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install trunk & wasm-bindgen
        run: |
          cargo install --locked trunk
          cargo install -f wasm-bindgen-cli --version 0.2.106
          wasm-bindgen -V

      # ==================== ALWAYS BUILD NON-THREADED & BINDGEN IT ====================
      - name: Build wasm (NON-threaded)
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=target/nt \
          cargo +nightly build --target wasm32-unknown-unknown --release

      - name: Locate wasm artifact (NON-threaded)
        id: wasm_nt
        shell: bash
        run: |
          set -euo pipefail
          ls -lah target/nt/wasm32-unknown-unknown/release || true
          WASM_PATH=$(ls target/nt/wasm32-unknown-unknown/release/*.wasm | head -n1 || true)
          if [ -z "${WASM_PATH:-}" ]; then
            echo "No NT .wasm produced under target/nt/wasm32-unknown-unknown/release"
            exit 1
          fi
          echo "Found NT wasm: $WASM_PATH"
          echo "path=$WASM_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate wasm-bindgen (NON-threaded)
        run: |
          set -euo pipefail
          rm -rf dist_wbg_nt
          mkdir -p dist_wbg_nt
          wasm-bindgen \
            --target web \
            --no-typescript \
            --out-dir dist_wbg_nt \
            --out-name raphael-xiv \
            "${{ steps.wasm_nt.outputs.path }}"
          ls -lah dist_wbg_nt || true

      # ==================== OPTIONALLY BUILD THREADED (WITH BINDGEN) ====================
      - name: Configure Cargo for wasm threads (target-scoped flags)
        if: ${{ env.WASM_THREADS == '1' }}
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.wasm32-unknown-unknown]
          rustflags = [
            "--cfg=web_sys_unstable_apis",
            "-C","target-feature=+atomics,+bulk-memory,+mutable-globals",
            "-C","link-arg=--shared-memory",
            "-C","link-arg=--import-memory",
            "-C","link-arg=--max-memory=4294967296",
            "-C","link-arg=--export=__wasm_init_tls",
            "-C","link-arg=--export=__tls_size",
            "-C","link-arg=--export=__tls_align",
            "-C","link-arg=--export=__tls_base",
          ]
          EOF
          cat .cargo/config.toml


      - name: Build wasm (THREADED)
        if: ${{ env.WASM_THREADS == '1' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=target/th \
          cargo +nightly build \
            -Z build-std=std,panic_abort \
            --features wasm_threads \
            --target wasm32-unknown-unknown \
            --release
          ls -lah target/th/wasm32-unknown-unknown/release || true

      - name: Locate wasm artifact (THREADED)
        if: ${{ env.WASM_THREADS == '1' }}
        id: wasm_th
        shell: bash
        run: |
          set -euo pipefail
          ls -lah target/th/wasm32-unknown-unknown/release || true
          WASM_PATH=$(ls target/th/wasm32-unknown-unknown/release/*.wasm | head -n1 || true)
          if [ -z "${WASM_PATH:-}" ]; then
            echo "No TH .wasm produced under target/th/wasm32-unknown-unknown/release"
            exit 1
          fi
          echo "Found TH wasm: $WASM_PATH"
          echo "path=$WASM_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate wasm-bindgen (THREADED)
        if: ${{ env.WASM_THREADS == '1' }}
        run: |
          set -euo pipefail
          rm -rf dist_wbg_th
          mkdir -p dist_wbg_th
          wasm-bindgen \
            --target web \
            --no-typescript \
            --out-dir dist_wbg_th \
            --out-name raphael-xiv \
            "${{ steps.wasm_th.outputs.path }}"
          ls -lah dist_wbg_th || true

      - name: Add wasm-bindgen-rayon worker helper (THREADED)
        if: ${{ env.WASM_THREADS == '1' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning generated JS for worker helper references..."
          if [ ! -f dist_wbg_th/raphael-xiv.js ]; then
            echo "::error::dist_wbg_th/raphael-xiv.js not found"
            ls -lah dist_wbg_th || true
            exit 1
          fi

          # Show any lines that mention worker helpers / bundler
          grep -nE "workerHelpers|no-bundler|bundler|new Worker" dist_wbg_th/raphael-xiv.js || true

          # Try to infer the helper filename from the generated JS
          HELPER_NAME="$(grep -oE "workerHelpers[^\"']*\.js" dist_wbg_th/raphael-xiv.js | head -n1 || true)"
          if [ -z "${HELPER_NAME:-}" ]; then
            echo "No explicit workerHelpers*.js reference found in raphael-xiv.js"
            echo "Not failing build; continuing (we may not need an extra helper file)."
            exit 0
          fi

          echo "Generated JS expects helper file: $HELPER_NAME"

          # Attempt to find that helper somewhere under cargo registry
          FOUND_PATH="$(find ~/.cargo/registry/src -type f -name "$HELPER_NAME" 2>/dev/null | head -n1 || true)"
          if [ -z "${FOUND_PATH:-}" ]; then
            echo "::warning::Could not find $HELPER_NAME in cargo registry. Continuing without it."
            echo "If runtime fails, we will vendor this helper into the repo."
            exit 0
          fi

          cp -f "$FOUND_PATH" "dist_wbg_th/$HELPER_NAME"
          echo "Copied $HELPER_NAME to dist_wbg_th/"
          ls -lah dist_wbg_th | sed -n '1,200p'


      # ==================== PREPARE SIMPLE HTML & LOADER (NO TRUNK PIPELINE) ====================
      - name: Prepare CI HTML (strip data-trunk & inject loader)
        shell: bash
        run: |
          set -euo pipefail

          cp index.html index.ci.html 2>/dev/null || true
          if [ ! -f index.ci.html ]; then
            cat > index.ci.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8"/>
              <meta name="viewport" content="width=device-width,initial-scale=1"/>
              <title>Raphael XIV</title>
            </head>
            <body>
              <div id="the_canvas_id"></div>
            </body>
          </html>
          HTML
          fi

          sed -i '/data-trunk/d' index.ci.html || true

          cat > loader.js <<'JS'
          import init, { initThreadPool } from './raphael-xiv.js';

          async function boot() {
            await init();

            // Attempt to init rayon thread pool (works only on threaded builds + COOP/COEP)
            try {
              const n = navigator.hardwareConcurrency || 4;
              await initThreadPool(n);
              console.log("Rayon thread pool initialized:", n);
            } catch (e) {
              console.warn("Rayon thread pool init failed (likely non-threaded build or missing isolation):", e);
            }
          }

          boot();
          JS

          if grep -qi '</body>' index.ci.html; then
            awk 'BEGIN{IGNORECASE=1}
                 /<\/body>/{print "<script type=\"module\" src=\"./loader.js\"></script>"; print; next}
                 {print}' index.ci.html > index.tmp && mv index.tmp index.ci.html
          else
            echo '<script type="module" src="./loader.js"></script>' >> index.ci.html
          fi

      # ==================== ASSEMBLE FINAL SITE ====================
      - name: Assemble final dist (threaded if enabled)
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          if [ "${WASM_THREADS}" = "1" ] && [ -d dist_wbg_th ]; then
            echo "Assembling THREADED wasm output"
            rsync -a dist_wbg_th/ dist/
          else
            echo "Assembling NON-THREADED wasm output"
            rsync -a dist_wbg_nt/ dist/
          fi

          echo "dist/ contents:"
          ls -lah dist || true
          [ -d dist/snippets ] && echo "snippets/ present ✅" || echo "snippets/ not present (may be OK) ⚠️"
          [ -f dist/workerHelpers-no-bundler.js ] && echo "workerHelpers-no-bundler.js present ✅" || echo "workerHelpers-no-bundler.js not present"

          # Static bits
          cp -f index.ci.html dist/index.html
          cp -f loader.js dist/

          [ -d assets ] && rsync -a assets/ dist/assets/
          [ -d assets/action-icons ] && rsync -a assets/action-icons/ dist/action-icons/
         
          echo "Checking action-icons source + dist..."
          ls -lah assets/action-icons | head -n 20 || true
          ls -lah dist/action-icons 2>/dev/null | head -n 20 || true
          ls -lah dist/action-icons/CUL 2>/dev/null | head -n 20 || true

          # Hard fail if we expect icons but they are missing
          if [ -d assets/action-icons ] && [ ! -f dist/action-icons/CUL/Groundwork.webp ]; then
            echo "::error::Expected dist/action-icons/CUL/Groundwork.webp but it is missing"
            exit 1
          fi
          
          [ -d static ] && rsync -a static/ dist/static/
          [ -d public ] && rsync -a public/ dist/
          [ -d assets/fonts ] && rsync -a assets/fonts/ dist/fonts/

          for f in favicon.ico favicon.png favicon.svg robots.txt sitemap.xml *.css; do
            [ -e "$f" ] && cp -f "$f" dist/ || true
          done

          # Security & caching headers (COOP/COEP required for threads)
          cat > dist/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          /index.html
            Cache-Control: no-cache
          /*.js
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin
          /*.wasm
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin
          EOF

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:   ${{ secrets.CF_API_TOKEN }}
          accountId:  ${{ secrets.CF_ACCOUNT_ID }}
          projectName: "ff14crafting"
          directory:  dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect version change in Cargo.toml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CARGO_FILE="Cargo.toml"
          git fetch --no-tags --depth=2 origin "${GITHUB_REF_NAME:-main}" || true
          prev="${{ github.event.before || '' }}"
          curr="${{ github.sha }}"
          if [ -z "$prev" ]; then
            prev="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          changed="false"
          if [ -n "$prev" ] && git diff --name-only "$prev" "$curr" | grep -x "$CARGO_FILE" >/dev/null 2>&1; then
            changed="true"
          fi
          version="$(
            awk '
              /^\[package\]$/ { p=1; next }
              /^\[/          { p=0 }
              p && /^version[[:space:]]*=/ {
                gsub(/"/,"",$3); print $3; exit
              }
            ' "$CARGO_FILE"
          )"
          echo "changed=$changed"  >> "$GITHUB_OUTPUT"
          echo "version=$version"  >> "$GITHUB_OUTPUT"

      - name: "Discord: deployed new version (embed)"
        if: ${{ steps.ver.outputs.changed == 'true' && success() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          site="https://crafting.bryansmedia.com/"
          title="Deployed v${{ steps.ver.outputs.version }}"
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          payload=$(jq -n \
            --arg t "$title" \
            --arg site "$site" \
            --arg repo "$repo" \
            --arg sha "$sha" \
            --arg sha_short "${sha:0:7}" \
            '{
              content: "",
              embeds: [{
                title: $t,
                url: $site,
                color: 5763719,
                fields: [
                  { "name": "Site",   "value": "<\($site)>", "inline": false },
                  { "name": "Repo",   "value": $repo,        "inline": true  },
                  { "name": "Commit", "value": "`\($sha)`",  "inline": false }
                ]
              }]
            }')
          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"

      - name: "Discord: deploy failed"
        if: ${{ failure() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="❌ Deploy failed for **${{ github.repository }}** on **${{ github.ref_name }}**  \nRun: ${run_url}"
          curl -sS -H "Content-Type: application/json" -d "{\"content\":\"${msg}\"}" "$DISCORD_WEBHOOK"
