name: Build & Deploy (main -> crafting.bryansmedia.com)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      wasm_threads:
        description: "Build with WebAssembly threads"
        type: choice
        required: false
        options: ["0","1"]
        default: "0"
  repository_dispatch:
    types: [deploy-from-sync]
  workflow_run:
    workflows: ["Sync from upstream (main)"]
    types: [completed]

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://crafting.bryansmedia.com"
      WASM_THREADS: ${{ github.event.inputs.wasm_threads || vars.WASM_THREADS || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use nightly toolchain with wasm target
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install trunk & wasm-bindgen
        run: |
          cargo install --locked trunk
          cargo install -f wasm-bindgen-cli --version 0.2.106
          wasm-bindgen -V

      # ==================== NON-THREADED PIPELINE ====================
      - name: Build wasm (NON-threaded)
        if: ${{ env.WASM_THREADS != '1' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=target/nt \
          cargo +nightly build --target wasm32-unknown-unknown --release

      - name: Locate wasm artifact (NON-threaded)
        id: wasm_nt
        if: ${{ env.WASM_THREADS != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lah target/nt/wasm32-unknown-unknown/release || true
          WASM_PATH=$(ls target/nt/wasm32-unknown-unknown/release/*.wasm | head -n1 || true)
          if [ -z "${WASM_PATH:-}" ]; then
            echo "No NT .wasm produced under target/nt/wasm32-unknown-unknown/release"
            exit 1
          fi
          echo "Found NT wasm: $WASM_PATH"
          echo "path=$WASM_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate wasm-bindgen (NON-threaded)
        if: ${{ env.WASM_THREADS != '1' }}
        run: |
          set -euo pipefail
          mkdir -p dist_wbg_nt
          wasm-bindgen \
            --target web \
            --no-typescript \
            --out-dir dist_wbg_nt \
            --out-name raphael-xiv \
            "${{ steps.wasm_nt.outputs.path }}"
          echo "Non-threaded bindgen output:"
          ls -lah dist_wbg_nt || true

      # ==================== THREADED PIPELINE ====================
      - name: Configure Cargo for wasm threads (target-scoped flags)
        if: ${{ env.WASM_THREADS == '1' }}
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.wasm32-unknown-unknown]
          rustflags = [
            "-C","target-feature=+atomics,+bulk-memory,+mutable-globals",
            "-C","link-arg=--shared-memory",
            "-C","link-arg=--import-memory",
            "-C","link-arg=--max-memory=4294967296",
          ]
          EOF
          echo "----- .cargo/config.toml -----"
          cat .cargo/config.toml

      - name: Build wasm (THREADED)
        if: ${{ env.WASM_THREADS == '1' }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=target/th \
          cargo +nightly build \
            -Z build-std=std,panic_abort \
            --features wasm_threads \
            --target wasm32-unknown-unknown \
            --release

      - name: Locate wasm artifact (THREADED)
        id: wasm_th
        if: ${{ env.WASM_THREADS == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lah target/th/wasm32-unknown-unknown/release || true
          WASM_PATH=$(ls target/th/wasm32-unknown-unknown/release/*.wasm | head -n1 || true)
          if [ -z "${WASM_PATH:-}" ]; then
            echo "No TH .wasm produced under target/th/wasm32-unknown-unknown/release"
            exit 1
          fi
          echo "Found TH wasm: $WASM_PATH"
          echo "path=$WASM_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate wasm-bindgen (THREADED; best-effort with fallback)
        if: ${{ env.WASM_THREADS == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist_wbg_th

          set +e
          wasm-bindgen \
            --target web \
            --no-typescript \
            --enable-threads \
            --out-dir dist_wbg_th \
            --out-name raphael-xiv \
            "${{ steps.wasm_th.outputs.path }}"
          rc=$?
          set -e

          if [ $rc -ne 0 ]; then
            echo "::warning::Threaded wasm-bindgen failed (likely missing __wasm_init_tls). Falling back to NON-threaded artifact for deploy."
            echo "TH_FAILED=1" >> "$GITHUB_ENV"
          else
            echo "Threaded bindgen output:"
            ls -lah dist_wbg_th || true
          fi

      # ==================== Prepare CI HTML & loader ====================
      - name: Prepare CI HTML (strip data-trunk & inject loader)
        shell: bash
        run: |
          set -euo pipefail

          cp index.html index.ci.html 2>/dev/null || true
          if [ ! -f index.ci.html ]; then
            cat > index.ci.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8"/>
              <meta name="viewport" content="width=device-width,initial-scale=1"/>
              <title>Raphael XIV</title>
            </head>
            <body>
              <div id="the_canvas_id"></div>
            </body>
          </html>
          HTML
          fi

          sed -i '/data-trunk/d' index.ci.html || true

          # Loader always imports the canonical name we will create later.
          cat > loader.js <<'JS'
          import init from './raphael-xiv.js';
          init();
          JS

          if grep -qi '</body>' index.ci.html; then
            awk 'BEGIN{IGNORECASE=1}
                 /<\/body>/{print "<script type=\"module\" src=\"./loader.js\"></script>"; print; next}
                 {print}' index.ci.html > index.tmp && mv index.tmp index.ci.html
          else
            echo '<script type="module" src="./loader.js"></script>' >> index.ci.html
          fi

      # ==================== Manually assemble final site (no Trunk) ====================
      - name: Assemble final dist (no Trunk)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          # Helper to choose real filenames (hyphen or underscore) and copy to canonical names
          copy_bindgen_outputs () {
            local srcdir="$1"
            local js=""
            local wasm=""

            if   [ -f "$srcdir/raphael-xiv.js" ]; then js="raphael-xiv.js"
            elif [ -f "$srcdir/raphael_xiv.js" ]; then js="raphael_xiv.js"
            fi

            if   [ -f "$srcdir/raphael-xiv_bg.wasm" ]; then wasm="raphael-xiv_bg.wasm"
            elif [ -f "$srcdir/raphael_xiv_bg.wasm" ]; then wasm="raphael_xiv_bg.wasm"
            fi

            if [ -z "$js" ] || [ -z "$wasm" ]; then
              echo "Bindgen artifacts not found in $srcdir"
              ls -lah "$srcdir" || true
              return 1
            fi

            # Copy to canonical names expected by loader.js
            cp -f "$srcdir/$js"   dist/raphael-xiv.js
            cp -f "$srcdir/$wasm" dist/raphael-xiv_bg.wasm
          }

          if [ "${WASM_THREADS}" = "1" ] && [ -z "${TH_FAILED:-}" ] && [ -d dist_wbg_th ]; then
            echo "Packaging THREADED build"
            copy_bindgen_outputs "dist_wbg_th" || {
              echo "::warning::Threaded artifacts missing; falling back to NON-threaded."
              copy_bindgen_outputs "dist_wbg_nt"
            }
          else
            echo "Packaging NON-THREADED build"
            copy_bindgen_outputs "dist_wbg_nt"
          fi

          # Copy CI HTML and loader
          cp -f index.ci.html dist/index.html
          cp -f loader.js dist/

          # Copy common static assets if present
          [ -d assets ] && rsync -a assets/ dist/assets/
          [ -d static ] && rsync -a static/ dist/static/
          [ -d public ] && rsync -a public/ dist/public/
          for f in favicon.ico favicon.png favicon.svg robots.txt sitemap.xml *.css; do
            [ -e "$f" ] && cp -f "$f" dist/ || true
          done

          # Security & caching headers (COOP/COEP required for threads)
          cat > dist/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          /index.html
            Cache-Control: no-cache
          /*.js
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin
          /*.wasm
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin
          EOF

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:   ${{ secrets.CF_API_TOKEN }}
          accountId:  ${{ secrets.CF_ACCOUNT_ID }}
          projectName: "ff14crafting"
          directory:  dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect version change in Cargo.toml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CARGO_FILE="Cargo.toml"
          git fetch --no-tags --depth=2 origin "${GITHUB_REF_NAME:-main}" || true
          prev="${{ github.event.before || '' }}"
          curr="${{ github.sha }}"
          if [ -z "$prev" ]; then
            prev="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          changed="false"
          if [ -n "$prev" ] && git diff --name-only "$prev" "$curr" | grep -x "$CARGO_FILE" >/dev/null 2>&1; then
            changed="true"
          fi
          version="$(
            awk '
              /^\[package\]$/ { p=1; next }
              /^\[/          { p=0 }
              p && /^version[[:space:]]*=/ {
                gsub(/"/,"",$3); print $3; exit
              }
            ' "$CARGO_FILE"
          )"
          echo "changed=$changed"  >> "$GITHUB_OUTPUT"
          echo "version=$version"  >> "$GITHUB_OUTPUT"

      - name: "Discord: deployed new version (embed)"
        if: ${{ steps.ver.outputs.changed == 'true' && success() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          site="https://crafting.bryansmedia.com/"
          title="Deployed v${{ steps.ver.outputs.version }}"
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          payload=$(jq -n \
            --arg t "$title" \
            --arg site "$site" \
            --arg repo "$repo" \
            --arg sha "$sha" \
            '{
              content: "",
              embeds: [{
                title: $t,
                url: $site,
                color: 5763719,
                fields: [
                  { "name": "Site",   "value": "<\($site)>", "inline": false },
                  { "name": "Repo",   "value": $repo,        "inline": true  },
                  { "name": "Commit", "value": "`\($sha)`",  "inline": true  }
                ]
              }]
            }')
          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"

      - name: "Discord: deploy failed"
        if: ${{ failure() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="❌ Deploy failed for **${{ github.repository }}** on **${{ github.ref_name }}**  \nRun: ${run_url}"
          curl -sS -H "Content-Type: application/json" -d "{\"content\":\"${msg}\"}" "$DISCORD_WEBHOOK"
