name: Build & Deploy (main -> crafting.bryansmedia.com)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-from-sync]
  workflow_run:
    workflows: ["Sync from upstream (main)"]
    types: [completed]

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory,+mutable-globals --cfg=web_sys_unstable_apis"
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: "-C target-feature=+atomics,+bulk-memory,+mutable-globals --cfg=web_sys_unstable_apis"
      BASE_URL: "https://crafting.bryansmedia.com"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD and HEAD~1 for version-change detection

      - name: Use nightly toolchain with wasm target
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Configure Cargo for wasm threads
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [build]
          target = "wasm32-unknown-unknown"

          [target.wasm32-unknown-unknown]
          rustflags = [
            "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
            # linker args recommended for shared memory
            "-C", "link-arg=--shared-memory",
            "-C", "link-arg=--max-memory=4294967296",
          ]

          [unstable]
          build-std = ["panic_abort", "std"]
          EOF

          echo "----- rustc -----"
          rustc -Vv
          echo "----- cargo -----"
          cargo -Vv
          echo "----- .cargo/config.toml -----"
          cat .cargo/config.toml

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install trunk
        run: cargo install --locked trunk

      - name: Build web (release)
        run: |
          trunk build index.html --release --dist dist

          cat > dist/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp

          /index.html
            Cache-Control: no-cache

          /*.js
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin

          /*.wasm
            Cache-Control: public, max-age=31536000, immutable
            Cross-Origin-Resource-Policy: same-origin
          EOF

      - name: Debug - verify token from secrets
        shell: bash
        env:
          CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}"
        run: |
          set -euo pipefail
          echo "Verifying token..."
          curl -fsSL -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | jq '{success, result: {status, id}}'

      - name: Debug - list Pages projects for this account
        shell: bash
        env:
          CF_API_TOKEN: "${{ secrets.CF_API_TOKEN }}"
          CF_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}"
        run: |
          set -euo pipefail
          echo "Account: ${CF_ACCOUNT_ID}"
          curl -fsSL -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" \
            | jq '{success, names: [.result[].name]}'

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:   ${{ secrets.CF_API_TOKEN }}
          accountId:  ${{ secrets.CF_ACCOUNT_ID }}
          projectName: "ff14crafting"
          directory:  dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # --- Detect if the root Cargo.toml changed (i.e., version bumped) ---
      - name: Detect version change in Cargo.toml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CARGO_FILE="Cargo.toml"

          # Ensure we have at least two commits in this shallow clone
          git fetch --no-tags --depth=2 origin "${GITHUB_REF_NAME:-main}" || true

          prev="${{ github.event.before || '' }}"
          curr="${{ github.sha }}"
          if [ -z "$prev" ]; then
            prev="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi

          changed="false"
          if [ -n "$prev" ] && git diff --name-only "$prev" "$curr" | grep -x "$CARGO_FILE" >/dev/null 2>&1; then
            changed="true"
          fi

          version="$(
            awk '
              /^\[package\]$/ { p=1; next }
              /^\[/          { p=0 }
              p && /^version[[:space:]]*=/ {
                gsub(/"/,"",$3); print $3; exit
              }
            ' "$CARGO_FILE"
          )"

          echo "changed=$changed"  >> "$GITHUB_OUTPUT"
          echo "version=$version"  >> "$GITHUB_OUTPUT"

      # --- Notify Discord only if version changed and the deploy succeeded ---
      - name: "Discord: deployed new version (embed)"
        if: ${{ steps.ver.outputs.changed == 'true' && success() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          site="https://crafting.bryansmedia.com/"
          title="Deployed v${{ steps.ver.outputs.version }}"
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"

          payload=$(jq -n \
            --arg t "$title" \
            --arg site "$site" \
            --arg repo "$repo" \
            --arg sha "$sha" \
            '{
              content: "",
              embeds: [{
                title: $t,
                url: $site,
                color: 5763719,
                fields: [
                  { "name": "Site",   "value": "<\($site)>", "inline": false },
                  { "name": "Repo",   "value": $repo,        "inline": true  },
                  { "name": "Commit", "value": "`\($sha)`",  "inline": true  }
                ]
              }]
            }')

          curl -sS -H "Content-Type: application/json" \
               -d "$payload" \
               "$DISCORD_WEBHOOK"

      # --- Always send a failure message if any step above failed ---
      - name: "Discord: deploy failed"
        if: ${{ failure() }}
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          msg="❌ Deploy failed for **${{ github.repository }}** on **${{ github.ref_name }}**  \nRun: ${run_url}"
          curl -sS -H "Content-Type: application/json" -d "{\"content\":\"${msg}\"}" "$DISCORD_WEBHOOK"
